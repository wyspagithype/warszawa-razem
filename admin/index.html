<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#faf8fd">
    <title>Panel edycji – Warszawa Razem</title>
    <link rel="icon" href="./logo.svg" type="image/svg+xml">
    <link href="./config.yml" type="text/yaml" rel="cms-config-url">
    <!-- Theme: only Sveltia CMS's own colour/font/radius variables are set here (matching the website),
         no internal selectors are overridden, so CMS updates cannot break the layout. -->
    <style>
      html:root[data-theme="light"] {
        --sui-base-hue: 285;
        --sui-primary-accent-color: #7b1fa2;
        --sui-primary-accent-color-light: #9333b8;
        --sui-primary-accent-color-dark: #560b73;
        --sui-primary-accent-color-text: #6a1590;
        --sui-primary-background-color: #faf8fd;
        --sui-secondary-background-color: #f1ecf8;
        --sui-tertiary-background-color: #e6dff2;
        --sui-textbox-background-color: #ffffff;
        --sui-textbox-border-color: #d8d0e6;
        --sui-secondary-foreground-color: #5b5b7e;
        --sui-selected-background-color: #ecdcf5;
        --sui-hover-background-color: #efe7f8;
      }
      html:root {
        --sui-font-family-default: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --sui-control-font-family: var(--sui-font-family-default);
        --sui-heading-font-family: var(--sui-font-family-default);
        --sui-tab-font-family: var(--sui-font-family-default);
        --sui-textbox-font-family: var(--sui-font-family-default);
        --sui-textbox-placeholder-font-family: var(--sui-font-family-default);
        --sui-control-medium-border-radius: 10px;
        --sui-textbox-border-radius: 10px;
        --sui-button-medium-border-radius: 10px;
        --sui-dialog-content-border-radius: 18px;
      }
      body { font-family: var(--sui-font-family-default); }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS: the editing panel. It edits content/places/*.json and content/photos/* in the
         GitHub repository (see admin/config.yml); every save is a commit that republishes the site. -->
    <script>
      // Friendly message when someone picks or drops a non-image file bigger than the limit (videos are not shrunk by the
      // panel, and a big upload can make the save fail with "Failed to fetch"). Keep MAX in sync with max_file_size in config.yml.
      (function () {
        var MAX = 10000000; // 10 MB
        function mb(n) { return (n / 1000000).toFixed(1).replace('.', ','); }
        function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function tooBig(f) { return f && f.size > MAX && !/^image\//.test(f.type); }
        function show(files) {
          var list = files.map(function (f) { return '<li><b>' + esc(f.name) + '</b> – ' + mb(f.size) + ' MB</li>'; }).join('');
          var d = document.createElement('dialog');
          d.style.cssText = 'border:0;border-radius:18px;padding:0;max-width:min(560px,92vw);font:16px/1.5 system-ui,sans-serif;color:#22224f;box-shadow:0 30px 80px rgba(20,0,40,.45)';
          d.innerHTML = '<div style="padding:24px 26px"><h2 style="margin:0 0 10px;font-size:1.25rem">Plik jest za duży / File is too big</h2>' +
            '<ul style="margin:0 0 12px;padding-left:20px">' + list + '</ul>' +
            '<p style="margin:0 0 10px"><b>Maksymalny rozmiar: 10 MB.</b> Zmniejsz film (np. w HandBrake, ustawienie „Fast 720p30”) i dodaj go ponownie. Możesz też wkleić link do filmu z YouTube lub Vimeo w polu „Link do filmu”.</p>' +
            '<p style="margin:0 0 18px;color:#5b5b7e"><b>Maximum size: 10 MB.</b> Shrink the video (for example with HandBrake, preset “Fast 720p30”) and add it again, or paste a YouTube or Vimeo link in the “Video link” field instead.</p>' +
            '<button type="button" style="font:700 15px system-ui;border:0;border-radius:999px;background:#99008e;color:#fff;padding:10px 22px;cursor:pointer">OK</button></div>';
          d.querySelector('button').addEventListener('click', function () { d.close(); });
          d.addEventListener('close', function () { d.remove(); });
          document.body.appendChild(d);
          d.showModal();
        }
        function check(list, e, input) {
          var big = Array.prototype.filter.call(list || [], tooBig);
          if (!big.length) return;
          e.stopImmediatePropagation();
          e.preventDefault();
          if (input) input.value = '';
          show(big);
        }
        document.addEventListener('change', function (e) { var t = e.target; if (t && t.tagName === 'INPUT' && t.type === 'file') check(t.files, e, t); }, true);
        document.addEventListener('drop', function (e) { if (e.dataTransfer) check(e.dataTransfer.files, e, null); }, true);
      })();
    </script>
    <script src="./sveltia-cms.js"></script>
    <script>
      // On every save: fill in the "Extra" block (created / modified, by whom) and stamp the first
      // publication date. The hook runs for single saves and for bulk edits in the list.
      (function () {
        if (!window.CMS || !CMS.registerEventListener) return;
        var pad = function (n) { return String(n).padStart(2, '0'); };
        var nowLocal = function () {
          var d = new Date();
          return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        };
        CMS.registerEventListener({
          name: 'preSave',
          handler: function (args) {
            var data = args.entry.get('data');
            if (!data.has('slug')) return; // only places carry the change history (not the settings file)
            var who = (args.author && (args.author.login || args.author.name)) || '';
            var now = nowLocal();
            var meta = data.get('meta');
            if (!meta || typeof meta.set !== 'function') data = data.set('meta', data.clear()); // new place: no "Extra" block yet
            if (!data.getIn(['meta', 'createdAt'])) data = data.setIn(['meta', 'createdAt'], now);
            if (who && !data.getIn(['meta', 'createdBy'])) data = data.setIn(['meta', 'createdBy'], who);
            data = data.setIn(['meta', 'updatedAt'], now);
            if (who) data = data.setIn(['meta', 'updatedBy'], who);
            if (data.get('status') === 'published' && !data.get('publishedAt')) data = data.set('publishedAt', nowLocal());
            return data;
          },
        });
      })();
    </script>
  </body>
</html>
